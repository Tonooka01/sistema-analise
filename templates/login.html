<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · NetVale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #09090b;
            --card-bg:     #18181b;
            --card-border: #27272a;
            --panel-bg:    #111113;
            --text-1:      #fafafa;
            --text-2:      #a1a1aa;
            --text-muted:  #71717a;
            --input-bg:    #09090b;
            --input-border:#3f3f46;
            --input-focus: #71717a;
            --btn-bg:      #fafafa;
            --btn-text:    #09090b;
            --btn-hover:   #e4e4e7;
            --separator:   #27272a;
            --link:        #a1a1aa;
            --link-hover:  #fafafa;
            --error-bg:    rgba(239,68,68,.1);
            --error-bd:    rgba(239,68,68,.35);
            --error-text:  #fca5a5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 1.5rem;
            overflow: hidden;
        }

        /* Webcam canvas background */
        #wcDisplay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Content above canvas */
        .login-wrapper, .footer {
            position: relative;
            z-index: 1;
        }

        /* Wrapper */
        .login-wrapper {
            width: 100%;
            max-width: 860px;
        }

        /* Card dois painéis */
        .card {
            background: rgba(24,24,27,0.92);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
            backdrop-filter: blur(12px);
        }
        @media (min-width: 700px) {
            .card { grid-template-columns: 1fr 1fr; }
        }

        /* Painel esquerdo — formulário */
        .form-panel {
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.5rem;
        }

        .form-header { text-align: center; }
        .form-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: .3rem;
        }
        .form-desc {
            font-size: .83rem;
            color: var(--text-muted);
        }

        /* Alerta de erro */
        .alert {
            background: var(--error-bg);
            border: 1px solid var(--error-bd);
            color: var(--error-text);
            border-radius: 8px;
            padding: .65rem .9rem;
            font-size: .82rem;
        }

        /* Campos */
        .fields { display: flex; flex-direction: column; gap: .9rem; }

        .field { display: flex; flex-direction: column; gap: .4rem; }
        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        label {
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-2);
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .58rem .9rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: .875rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-1);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input::placeholder { color: #52525b; }
        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(113,113,122,.18);
        }

        /* Botão */
        .btn-login {
            width: 100%;
            padding: .65rem;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: .9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, transform .1s;
            margin-top: .15rem;
        }
        .btn-login:hover  { background: var(--btn-hover); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        /* Painel direito — decorativo */
        .deco-panel {
            display: none;
            background: rgba(17,17,19,0.7);
            position: relative;
            overflow: hidden;
            min-height: 340px;
        }
        @media (min-width: 700px) { .deco-panel { display: flex; } }

        .deco-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Grid decorativo de fundo */
        .deco-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--card-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: .3;
        }
        /* Gradiente central */
        .deco-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(9,9,11,.1) 0%, rgba(17,17,19,0.5) 80%);
        }

        .deco-logo {
            width: 52px;
            height: 52px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .deco-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-1);
            letter-spacing: -.01em;
        }
        .deco-tagline {
            font-size: .78rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 180px;
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            font-size: .72rem;
            color: #3f3f46;
            text-align: center;
        }
        .footer a {
            color: var(--link);
            text-underline-offset: 3px;
        }
        .footer a:hover { color: var(--link-hover); }
    </style>
</head>
<body>

    <!-- Webcam pixel grid background -->
    <canvas id="wcDisplay"></canvas>
    <video id="wcVideo" style="display:none;" playsinline muted></video>
    <canvas id="wcProc" style="display:none;"></canvas>

    <div class="login-wrapper">
        <div class="card">

            <!-- Formulário -->
            <div class="form-panel">
                <div class="form-header">
                    <div class="form-title">Hey Cuzzo</div>
                    <div class="form-desc">enter down here</div>
                </div>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert">{{ messages[0] }}</div>
                    {% endif %}
                {% endwith %}

                <form action="/login" method="POST">
                    <div class="fields">
                        <div class="field">
                            <label for="username">Usuário</label>
                            <input id="username" name="username" type="text"
                                   placeholder="Digite seu usuário" required autofocus>
                        </div>
                        <div class="field">
                            <div class="field-row">
                                <label for="password">Senha</label>
                            </div>
                            <input id="password" name="password" type="password"
                                   placeholder="••••••••••" required>
                        </div>
                        <button class="btn-login" type="submit">Login</button>
                    </div>
                </form>
            </div>

            <!-- Painel decorativo -->
            <div class="deco-panel">
                <div class="deco-inner">
                    <div class="deco-logo">📊</div>
                    <div class="deco-name">NetVale</div>
                    <div class="deco-tagline">Dashboard de Gestão · Telecom</div>
                </div>
            </div>

        </div>
    </div>

    <p class="footer">Acesso restrito · NetVale Telecom · © 2026</p>

<script>
(function () {
    var COLS = 64, ROWS = 48;
    var MAX_ELEV = 15, SENSITIVITY = 0.4, SMOOTHING = 0.1, GAP = 0.1;
    var BG = '#09090b';

    var dispCanvas = document.getElementById('wcDisplay');
    var procCanvas = document.getElementById('wcProc');
    var video      = document.getElementById('wcVideo');

    var prevFrame = null;
    var pixels = [];
    for (var r = 0; r < ROWS; r++) {
        pixels[r] = [];
        for (var c = 0; c < COLS; c++) {
            pixels[r][c] = { r: 20, g: 20, b: 20, motion: 0, target: 0, current: 0 };
        }
    }

    function render() {
        var procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        var dispCtx = dispCanvas.getContext('2d');
        if (!procCtx || !dispCtx || video.readyState < 2) {
            requestAnimationFrame(render); return;
        }

        procCanvas.width  = COLS;
        procCanvas.height = ROWS;
        procCtx.save();
        procCtx.scale(-1, 1);
        procCtx.drawImage(video, -COLS, 0, COLS, ROWS);
        procCtx.restore();

        var img  = procCtx.getImageData(0, 0, COLS, ROWS);
        var cur  = img.data;
        var prev = prevFrame;

        for (var row = 0; row < ROWS; row++) {
            for (var col = 0; col < COLS; col++) {
                var idx = (row * COLS + col) * 4;
                var pr = cur[idx], pg = cur[idx+1], pb = cur[idx+2];
                var px = pixels[row][col];

                var motion = 0;
                if (prev) {
                    var diff = Math.abs(pr - prev[idx]) + Math.abs(pg - prev[idx+1]) + Math.abs(pb - prev[idx+2]);
                    motion = Math.min(1, diff / 255 / SENSITIVITY);
                }
                px.motion = px.motion * 0.7 + motion * 0.3;

                // Darken heavily so background stays subtle
                px.r = Math.round(pr * 0.25);
                px.g = Math.round(pg * 0.25);
                px.b = Math.round(pb * 0.25);

                px.target  = px.motion * MAX_ELEV;
                px.current += (px.target - px.current) * SMOOTHING;
            }
        }
        prevFrame = new Uint8ClampedArray(cur);

        var dpr = window.devicePixelRatio || 1;
        var W = dispCanvas.clientWidth;
        var H = dispCanvas.clientHeight;
        dispCanvas.width  = W * dpr;
        dispCanvas.height = H * dpr;
        dispCtx.scale(dpr, dpr);

        dispCtx.fillStyle = BG;
        dispCtx.fillRect(0, 0, W, H);

        var cell  = Math.max(W / COLS, H / ROWS);
        var gap   = cell * GAP;
        var offX  = (W - cell * COLS) / 2;
        var offY  = (H - cell * ROWS) / 2;

        for (var row = 0; row < ROWS; row++) {
            for (var col = 0; col < COLS; col++) {
                var px   = pixels[row][col];
                var x    = offX + col * cell;
                var y    = offY + row * cell;
                var elev = px.current;
                var ox   = -elev * 1.2;
                var oy   = -elev * 1.8;

                // Shadow
                if (elev > 0.5) {
                    dispCtx.fillStyle = 'rgba(0,0,0,' + Math.min(0.6, elev * 0.04) + ')';
                    dispCtx.fillRect(x + gap/2 + elev*1.5, y + gap/2 + elev*2, cell - gap, cell - gap);
                }

                // Right face
                if (elev > 0.5) {
                    dispCtx.fillStyle = 'rgb(' + Math.max(0,px.r-80) + ',' + Math.max(0,px.g-80) + ',' + Math.max(0,px.b-80) + ')';
                    dispCtx.beginPath();
                    dispCtx.moveTo(x+cell-gap/2+ox, y+gap/2+oy);
                    dispCtx.lineTo(x+cell-gap/2,    y+gap/2);
                    dispCtx.lineTo(x+cell-gap/2,    y+cell-gap/2);
                    dispCtx.lineTo(x+cell-gap/2+ox, y+cell-gap/2+oy);
                    dispCtx.closePath();
                    dispCtx.fill();

                    // Bottom face
                    dispCtx.fillStyle = 'rgb(' + Math.max(0,px.r-50) + ',' + Math.max(0,px.g-50) + ',' + Math.max(0,px.b-50) + ')';
                    dispCtx.beginPath();
                    dispCtx.moveTo(x+gap/2+ox,      y+cell-gap/2+oy);
                    dispCtx.lineTo(x+gap/2,          y+cell-gap/2);
                    dispCtx.lineTo(x+cell-gap/2,     y+cell-gap/2);
                    dispCtx.lineTo(x+cell-gap/2+ox,  y+cell-gap/2+oy);
                    dispCtx.closePath();
                    dispCtx.fill();
                }

                // Top face
                var bright = 1 + elev * 0.05;
                dispCtx.fillStyle = 'rgb(' + Math.min(255,Math.round(px.r*bright)) + ',' + Math.min(255,Math.round(px.g*bright)) + ',' + Math.min(255,Math.round(px.b*bright)) + ')';
                dispCtx.fillRect(x+gap/2+ox, y+gap/2+oy, cell-gap, cell-gap);

                // Border
                dispCtx.strokeStyle = 'rgba(255,255,255,' + (0.06 + elev*0.008) + ')';
                dispCtx.lineWidth = 0.5;
                dispCtx.strokeRect(x+gap/2+ox, y+gap/2+oy, cell-gap, cell-gap);
            }
        }

        requestAnimationFrame(render);
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } })
            .then(function(stream) {
                video.srcObject = stream;
                return video.play();
            })
            .then(function() {
                requestAnimationFrame(render);
            })
            .catch(function() {
                // Sem câmera — fundo estático continua visível
            });
    }
})();
</script>

</body>
</html>
