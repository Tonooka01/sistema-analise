<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · NetVale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #09090b;
            --card-bg:     #18181b;
            --card-border: #27272a;
            --panel-bg:    #111113;
            --text-1:      #fafafa;
            --text-2:      #a1a1aa;
            --text-muted:  #71717a;
            --input-bg:    #09090b;
            --input-border:#3f3f46;
            --input-focus: #71717a;
            --btn-bg:      #fafafa;
            --btn-text:    #09090b;
            --btn-hover:   #e4e4e7;
            --separator:   #27272a;
            --link:        #a1a1aa;
            --link-hover:  #fafafa;
            --error-bg:    rgba(239,68,68,.1);
            --error-bd:    rgba(239,68,68,.35);
            --error-text:  #fca5a5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        /* Wrapper */
        .login-wrapper {
            width: 100%;
            max-width: 860px;
        }

        /* Card dois painéis */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr;
        }
        @media (min-width: 700px) {
            .card { grid-template-columns: 1fr 1fr; }
        }

        /* Painel esquerdo — formulário */
        .form-panel {
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1.5rem;
        }

        .form-header { text-align: center; }
        .form-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-1);
            margin-bottom: .3rem;
        }
        .form-desc {
            font-size: .83rem;
            color: var(--text-muted);
        }

        /* Alerta de erro */
        .alert {
            background: var(--error-bg);
            border: 1px solid var(--error-bd);
            color: var(--error-text);
            border-radius: 8px;
            padding: .65rem .9rem;
            font-size: .82rem;
        }

        /* Campos */
        .fields { display: flex; flex-direction: column; gap: .9rem; }

        .field { display: flex; flex-direction: column; gap: .4rem; }
        .field-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        label {
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-2);
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: .58rem .9rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            font-size: .875rem;
            font-family: 'Inter', sans-serif;
            color: var(--text-1);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input::placeholder { color: #52525b; }
        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(113,113,122,.18);
        }

        /* Botão */
        .btn-login {
            width: 100%;
            padding: .65rem;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: .9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background .15s, transform .1s;
            margin-top: .15rem;
        }
        .btn-login:hover  { background: var(--btn-hover); transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        /* Painel direito — decorativo */
        .deco-panel {
            display: none;
            background: var(--panel-bg);
            position: relative;
            overflow: hidden;
            min-height: 340px;
        }
        @media (min-width: 700px) { .deco-panel { display: flex; } }

        .deco-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Grid decorativo de fundo */
        .deco-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--card-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--card-border) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: .5;
        }
        /* Gradiente central */
        .deco-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(9,9,11,.2) 0%, var(--panel-bg) 80%);
        }

        .deco-logo {
            width: 52px;
            height: 52px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .deco-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-1);
            letter-spacing: -.01em;
        }
        .deco-tagline {
            font-size: .78rem;
            color: var(--text-muted);
            text-align: center;
            max-width: 180px;
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            font-size: .72rem;
            color: #3f3f46;
            text-align: center;
        }
        .footer a {
            color: var(--link);
            text-underline-offset: 3px;
        }
        .footer a:hover { color: var(--link-hover); }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="card">

            <!-- Formulário -->
            <div class="form-panel">
                <div class="form-header">
                    <div class="form-title">Hey Cuzzo</div>
                    <div class="form-desc">enter down here</div>
                </div>

                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        <div class="alert">{{ messages[0] }}</div>
                    {% endif %}
                {% endwith %}

                <form action="/login" method="POST">
                    <div class="fields">
                        <div class="field">
                            <label for="username">Usuário</label>
                            <input id="username" name="username" type="text"
                                   placeholder="Digite seu usuário" required autofocus>
                        </div>
                        <div class="field">
                            <div class="field-row">
                                <label for="password">Senha</label>
                            </div>
                            <input id="password" name="password" type="password"
                                   placeholder="••••••••••" required>
                        </div>
                        <button class="btn-login" type="submit">Login</button>
                    </div>
                </form>
            </div>

            <!-- Painel decorativo -->
            <div class="deco-panel">
                <div class="deco-inner">
                    <div class="deco-logo">📊</div>
                    <div class="deco-name">NetVale</div>
                    <div class="deco-tagline">Dashboard de Gestão · Telecom</div>
                </div>
            </div>

        </div>
    </div>

    <p class="footer">Acesso restrito · NetVale Telecom · © 2026</p>

</body>
</html>
